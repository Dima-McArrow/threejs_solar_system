<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03050b" />
    <title>Solar System · An orbital atlas</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03050b; }
      body { color: #e9edf5; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .intro { position: absolute; top: 36px; left: 40px; pointer-events: none; }
      .eyebrow { color: #b7a582; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; }
      h1 { margin: 12px 0 9px; font-size: clamp(28px, 4vw, 48px); font-weight: 300; letter-spacing: -.04em; }
      .subtitle { margin: 0; color: #8b95a8; font-size: 12px; letter-spacing: .04em; }
      .footer { position: absolute; bottom: 28px; left: 40px; right: 40px; display: flex; justify-content: space-between; gap: 18px; color: #929bad; font-size: 11px; pointer-events: none; }
      .footer span:last-child { text-align: right; }
      #status { position: absolute; top: 40px; right: 40px; color: #929bad; font-size: 11px; max-width: 240px; text-align: right; }
      @media (max-width: 600px) {
        .intro { top: 24px; left: 22px; }
        #status { top: auto; bottom: 82px; right: 22px; }
        .footer { left: 22px; right: 22px; bottom: 22px; flex-direction: column; font-size: 10px; }
        .footer span:last-child { text-align: left; }
      }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <header class="intro">
      <div class="eyebrow">An orbital atlas / 01</div>
      <h1>The Solar System</h1>
      <p class="subtitle">Eight worlds. One star. Endless space.</p>
    </header>
    <div id="status" role="status" aria-live="polite">Loading planetary surfaces…</div>
    <footer class="footer">
      <span>Left Click: Rotate | Scroll: Zoom | Right Click: Pan</span>
      <span>Sizes & distances compressed for exploration</span>
    </footer>
    <script type="module">
      const status = document.querySelector('#status');
      try {
        const THREE = await import('three');
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03050b);
        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2400);
        camera.position.set(0, 105, 165);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.prepend(renderer.domElement);
        renderer.domElement.setAttribute('aria-label', 'Interactive three-dimensional solar system');
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 12;
        controls.maxDistance = 350;
        controls.maxPolarAngle = Math.PI * 0.94;
        scene.add(new THREE.AmbientLight(0xb9caff, 0.065));
        // Compressed orbital distances need constant illumination to keep outer worlds visible.
        const sunlight = new THREE.PointLight(0xfff1dc, 3.2, 0, 0);
        scene.add(sunlight);
        const sun = new THREE.Mesh(
          new THREE.SphereGeometry(5.5, 64, 48),
          new THREE.MeshBasicMaterial({ color: 0xff6600, toneMapped: false }),
        );
        scene.add(sun);

        // A procedural halo keeps the Sun solid orange without requiring another asset.
        const haloCanvas = document.createElement('canvas');
        haloCanvas.width = haloCanvas.height = 128;
        const ctx = haloCanvas.getContext('2d');
        const gradient = ctx.createRadialGradient(64, 64, 12, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(255,130,35,0.5)');
        gradient.addColorStop(0.4, 'rgba(255,95,15,0.16)');
        gradient.addColorStop(1, 'rgba(255,70,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: new THREE.CanvasTexture(haloCanvas), blending: THREE.AdditiveBlending,
          transparent: true, depthWrite: false, toneMapped: false,
        }));
        halo.scale.set(30, 30, 1);
        scene.add(halo);

        const starCount = 8000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const starColor = new THREE.Color();
        for (let i = 0; i < starCount; i++) {
          const azimuth = Math.random() * Math.PI * 2;
          const vertical = Math.random() * 2 - 1;
          const radius = 650 + Math.random() * 400;
          const horizontal = Math.sqrt(1 - vertical * vertical);
          positions.set([radius * horizontal * Math.cos(azimuth), radius * vertical,
            radius * horizontal * Math.sin(azimuth)], i * 3);
          starColor.setHSL(0.55 + Math.random() * 0.12, Math.random() * 0.3, 0.5 + Math.random() * 0.5);
          colors.set([starColor.r, starColor.g, starColor.b], i * 3);
        }
        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({
          size: 1.15, vertexColors: true, sizeAttenuation: true, toneMapped: false,
        })));

        const textureBase = 'https://www.solarsystemscope.com/textures/download/';
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        let finished = 0;
        let fallbacks = 0;
        function loadSurface(material, filename, fallbackColor) {
          material.color.setHex(fallbackColor);
          let settled = false;
          const timeout = setTimeout(() => finish(null), 15000);
          function finish(texture) {
            if (settled) { texture?.dispose(); return; }
            settled = true;
            clearTimeout(timeout);
            if (texture) {
              texture.colorSpace = THREE.SRGBColorSpace;
              texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
              material.map = texture;
              material.color.setHex(0xffffff);
            } else {
              material.map = null;
              material.color.setHex(fallbackColor);
              fallbacks++;
            }
            material.needsUpdate = true;
            finished++;
            status.textContent = finished === 8
              ? (fallbacks ? `Ready · ${fallbacks} surfaces using fallback colors` : 'All eight worlds ready')
              : `Loading planetary surfaces · ${finished}/8`;
          }
          try { loader.load(textureBase + filename, finish, undefined, () => finish(null)); }
          catch { finish(null); }
        }

        const definitions = [
          { name: 'Mercury', radius: 0.65, orbit: 10, period: 0.241, spin: 0.10, tilt: 0.03, color: 0x9b9286, texture: '2k_mercury.jpg' },
          { name: 'Venus', radius: 1.05, orbit: 14, period: 0.615, spin: -0.04, tilt: 2.6, color: 0xd6b779, texture: '2k_venus_surface.jpg' },
          { name: 'Earth', radius: 1.15, orbit: 19, period: 1, spin: 0.65, tilt: 23.4, color: 0x3579b7, texture: '2k_earth_daymap.jpg' },
          { name: 'Mars', radius: 0.85, orbit: 25, period: 1.881, spin: 0.62, tilt: 25.2, color: 0xb65c3e, texture: '2k_mars.jpg' },
          { name: 'Jupiter', radius: 3.2, orbit: 36, period: 11.86, spin: 1.35, tilt: 3.1, color: 0xc5a17f, texture: '2k_jupiter.jpg' },
          { name: 'Saturn', radius: 2.75, orbit: 49, period: 29.46, spin: 1.22, tilt: 26.7, color: 0xd8c18c, texture: '2k_saturn.jpg', rings: [3.5, 5.9, 0xcbb98b, 0.56] },
          { name: 'Uranus', radius: 1.95, orbit: 64, period: 84.01, spin: -0.85, tilt: 97.8, color: 0x91ced3, texture: '2k_uranus.jpg', rings: [2.45, 3.15, 0x9dbfc1, 0.28] },
          { name: 'Neptune', radius: 1.85, orbit: 79, period: 164.8, spin: 0.90, tilt: 28.3, color: 0x355cc3, texture: '2k_neptune.jpg' },
        ];
        const planets = definitions.map((data, index) => {
          const material = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.94, metalness: 0 });
          const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 64, 40), material);
          mesh.name = data.name;
          const axis = new THREE.Group();
          axis.rotation.z = THREE.MathUtils.degToRad(data.tilt);
          axis.add(mesh);
          scene.add(axis);
          loadSurface(material, data.texture, data.color);
          if (data.rings) {
            const [inner, outer, color, opacity] = data.rings;
            const rings = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 160),
              new THREE.MeshStandardMaterial({ color, opacity, transparent: true,
                side: THREE.DoubleSide, depthWrite: false, roughness: 1 }));
            rings.rotation.x = -Math.PI / 2;
            axis.add(rings);
            // Narrow concentric bands provide visible structure without ring textures.
            for (let band = 0; band < 5; band++) {
              const r = inner + (outer - inner) * (band + 1) / 6;
              const stripe = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.035, 160),
                new THREE.MeshBasicMaterial({ color: 0x544d41, transparent: true,
                  opacity: 0.3, side: THREE.DoubleSide, depthWrite: false }));
              stripe.rotation.x = -Math.PI / 2;
              stripe.position.y = 0.003;
              axis.add(stripe);
            }
          }
          const points = [];
          for (let step = 0; step < 256; step++) {
            const angle = step / 256 * Math.PI * 2;
            points.push(new THREE.Vector3(Math.cos(angle) * data.orbit, 0, Math.sin(angle) * data.orbit));
          }
          scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),
            new THREE.LineBasicMaterial({ color: 0x6c7b96, transparent: true, opacity: 0.18 })));
          return { ...data, mesh, axis, angle: index * 2.399, speed: 0.18 / Math.pow(data.period, 0.65) };
        });

        let previousTime = null;
        function animate(time) {
          requestAnimationFrame(animate);
          const delta = previousTime === null ? 0 : Math.min((time - previousTime) / 1000, 0.05);
          previousTime = time;
          for (const planet of planets) {
            planet.angle += planet.speed * delta;
            planet.axis.position.set(Math.cos(planet.angle) * planet.orbit, 0, Math.sin(planet.angle) * planet.orbit);
            planet.mesh.rotation.y += planet.spin * delta;
          }
          controls.update();
          renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
        window.addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setSize(innerWidth, innerHeight);
        });
        renderer.domElement.addEventListener('webglcontextlost', (event) => {
          event.preventDefault();
          status.textContent = 'Graphics context lost. Reload to resume.';
        });
      } catch (error) {
        status.textContent = 'Unable to start WebGL. Check your connection and browser support, then reload.';
        console.error('Solar system initialization failed:', error);
      }
    </script>
  </body>
</html>
